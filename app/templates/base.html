<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Filaman{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/custom.css">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    })();
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
<nav class="container">
  <ul>
    <li><strong><a href="/spools" class="brand">&#129525; Filaman</a></strong></li>
  </ul>
  <ul class="nav-links">
    {% if username %}
    <li><a href="/spools">Spools</a></li>
    <li><a href="/manufacturers">Manufacturers</a></li>
    <li><a href="/materials">Materials</a></li>
    <li><a href="/colors">Colors</a></li>
    <li><a href="/import">AI Import</a></li>
    <li><a href="/admin">Admin</a></li>
    {% endif %}
    <li><button id="theme-toggle" class="outline secondary" title="Toggle light/dark theme">&#127769;</button></li>
    {% if username %}
    <li>
      <form method="post" action="/logout" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="outline secondary">Logout</button>
      </form>
    </li>
    {% endif %}
  </ul>
</nav>
<main class="container">
  {% for f in flashes %}
  <div class="flash flash-{{ f.category }}">{{ f.message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script>
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("theme", next);
  });
</script>
</body>
</html>
